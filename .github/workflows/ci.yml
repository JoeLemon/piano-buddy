name: CI

# 一条命令能跑的东西，就不该只靠本地手跑。
# 两个 job 分开的原因：headless 验收要下载 chromium（几分钟），
# 类型/单测/内容校验只要几十秒——坏在代码上时没必要等浏览器。
on:
  # 所有分支的推送都跑：这个仓库的活儿都在 feat/* 上做，只写 main 的话
  # 推上去要等有人开 PR 才有反馈。
  push:
  pull_request:
  # 手动跑一次：改动只涉及脚本或内容、不想等 PR 时用
  workflow_dispatch:

# 同一条分支的「推送」和「PR 同步」测的是同一棵树：按分支名归组，
# 后来的那次取消前一次，省掉一半重复跑。
concurrency:
  group: ci-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  check:
    name: 类型 / 单测 / 内容 QA
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # build = vue-tsc --noEmit + vite build，类型错与产物错一次暴露
      - name: 类型检查与生产构建
        run: npm run build

      - name: 单元测试
        run: npm test

      - name: 曲目包内容 QA（词汇表 / 评级 / 指法）
        run: npm run validate:content

      # catalog.json 是 build:catalog 的产物，不是手写文件。
      # 忘记重新生成会让曲库少一首歌，这里直接判失败。
      - name: 曲库目录与内容包一致
        run: |
          npm run build:catalog
          git diff --exit-code -- content/catalog.json

  headless:
    name: headless 视觉验收
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # playwright-core 只装驱动、不带浏览器，浏览器版本由它自己决定，
      # 所以这里用同一个包来装，避免「驱动 1.64 + 浏览器 1223」这种错配。
      - name: 安装 chromium
        # 直接用 npx 而不是 npm script：CI 不依赖 package.json 里的别名，
        # 本地仍可用 `npm run verify:install`
        run: npx playwright-core install --with-deps chromium

      # verify-all 自己起 vite、跑完关掉，端口用 127.0.0.1 显式绑定
      - name: 5 个验收脚本 / 60 项断言
        run: npm run verify:all

      - name: 失败时保留截图
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: verify-shots
          path: shots/
          if-no-files-found: ignore

  android:
    name: Android 原生构建
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # cap sync 会把 dist/ 和插件同步进 android/，所以必须先构建 web 产物
      - name: 构建 web 产物
        run: npm run build

      - name: 同步到原生工程
        run: npx cap sync android

      # AGP 8.13 要求 JDK 17+；runner 自带 17，这里显式钉 21 免得随镜像漂移
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - uses: gradle/actions/setup-gradle@v4

      # 只编 debug：要验证的是「原生工程能编译」——JDK/AGP 版本、
      # 插件注册、AndroidManifest 里的蓝牙权限能不能被合并，这些错了
      # 都要等真机构建才发现
      - name: 编译 debug APK
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon

      - name: 上传 APK
        uses: actions/upload-artifact@v4
        with:
          name: piano-buddy-debug-apk
          path: android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

  ios:
    name: iOS 原生构建
    # macOS runner 按 10 倍计费，跑一次 5–10 分钟；这里只编译、不签名，
    # 要验证的是「Swift Package 依赖能解析、Info.plist 与插件注册没写错」。
    runs-on: macos-latest
    timeout-minutes: 30
    # 临时：诊断步骤要往 commit 发评论（默认 token 对 contents 只读）
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: 构建 web 产物
        run: npm run build

      # sync 会重写 ios/App/CapApp-SPM/Package.swift，把插件按 SPM 依赖挂进去；
      # 那个 Package.swift 里还引用了 node_modules 下的本地路径，所以必须先 npm ci
      - name: 同步到原生工程
        run: npx cap sync ios

      # 工程里没有提交 shared scheme（Xcode 打开时才生成），所以用 -target 而不是 -scheme；
      # -destination 只对 scheme 有效，模拟器用 -sdk 指定即可
      - name: 编译（模拟器，跳过签名）
        working-directory: ios/App
        run: |
          set -o pipefail
          xcodebuild -project App.xcodeproj -target App \
            -configuration Debug -sdk iphonesimulator \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            build 2>&1 | tee build.log

      # 临时诊断：仓库日志接口要管理员权限，失败时把关键信息发成 commit 评论。
      # 脚本写进文件再执行——直接塞 node -e "…" 会被 shell 的反引号吃掉（第一次就是
      # 这么空着的）；YAML 块缩进 10 空格，运行到 shell 时 heredoc 正文回到行首。
      - name: 诊断：失败时贴编译错误
        if: failure()
        working-directory: ios/App
        env:
          TOKEN: ${{ github.token }}
        run: |
          cat > diag.mjs <<'JS'
          import { existsSync, readFileSync, readdirSync, statSync } from "node:fs";
          import { execSync } from "node:child_process";

          const info = { cwd: process.cwd(), files: readdirSync(".").join(",") };
          info.logExists = existsSync("build.log");
          info.logSize = info.logExists ? statSync("build.log").size : -1;
          try {
            info.xcodebuild = execSync("xcodebuild -version", { encoding: "utf8" }).trim();
          } catch (error) {
            info.xcodebuild = `ERR ${error.message}`;
          }
          const log = info.logExists ? readFileSync("build.log", "utf8") : "";
          const body = [
            "iOS 构建失败（临时诊断）",
            "",
            "```json",
            JSON.stringify(info, null, 2),
            "```",
            "```",
            log.slice(-4000) || "(空)",
            "```",
          ].join("\n");
          const response = await fetch(
            `${process.env.GITHUB_API_URL}/repos/${process.env.GITHUB_REPOSITORY}/commits/${process.env.GITHUB_SHA}/comments`,
            {
              method: "POST",
              headers: { authorization: `Bearer ${process.env.TOKEN}`, accept: "application/vnd.github+json" },
              body: JSON.stringify({ body }),
            },
          );
          console.log((await response.text()).slice(0, 300));
          JS
          node diag.mjs

      - name: 检查产物
        run: test -d ios/App/build/Build/Products/Debug-iphonesimulator/App.app && echo "App.app 已生成"

  # 蓝牙能不能连、授权弹窗长什么样，只能在真机上验（模拟器没有 BLE），
  # 清单见 docs/移动端-BLE接入.md。
